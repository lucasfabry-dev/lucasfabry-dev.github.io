<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Fabry FIALIARIVONY - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #4A90E2, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .lang-buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            border: 2px solid #4A90E2;
            background: transparent;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lang-btn:hover {
            background: #4A90E2;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.3);
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 1.8rem;
            }
            
            .lang-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .lang-btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">Lucasfabry-dev</div>
        <p class="subtitle">
            Développeur Web Junior | Junior Web Developer<br>
            Consultant Odoo ERP | Odoo ERP Consultant
        </p>
        <div class="lang-buttons">
            <a href="fr/index.html" class="lang-btn">
                <img src="assets/icones/la-france.png" alt="FR" width="24"> Français
            </a>
            <a href="en/index.html" class="lang-btn">
                <img src="assets/icones/royaume-uni.png" alt="GB" width="24"> Français English
            </a>
        </div>
    </div>
</body>
</html>
